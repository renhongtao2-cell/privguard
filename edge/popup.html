<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PrivGuard 去水印</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;width:360px;font:14px/1.5 -apple-system,"Segoe UI",sans-serif;color:#0f172a}
  .hd{padding:12px 14px;background:#4f46e5;color:#fff;font-weight:700;display:flex;align-items:center;gap:8px}
  .hd .dot{width:9px;height:9px;border-radius:50%;background:#fff}
  .bd{padding:14px}
  .drop{border:1.5px dashed #cbd5e1;border-radius:10px;padding:18px;text-align:center;color:#64748b;background:#f8fafc;cursor:pointer;font-size:13px}
  .drop.drag{border-color:#4f46e5;background:#eef2ff}
  .bar{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
  .bar input[type=range]{flex:1}
  button{background:#4f46e5;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
  button.ghost{background:#fff;color:#4f46e5;border:1px solid #cbd5e1}
  button:disabled{opacity:.5;cursor:not-allowed}
  canvas{max-width:100%;border:1px solid #e2e8f0;border-radius:8px;background:#fff;touch-action:none;margin-top:8px}
  .meta{font-size:12px;color:#64748b;margin-top:8px}
  .note{font-size:11px;color:#b45309;background:#fef3c7;border-radius:8px;padding:8px;margin-top:10px}
  .hide{display:none}
</style>
</head>
<body>
<div class="hd"><span class="dot"></span>PrivGuard 去水印</div>
<div class="bd">
  <label class="drop" id="drop">点击或拖入图片<br><small>JPG/PNG · 本地处理不上传</small></label>
  <input type="file" id="file" accept="image/*" hidden>
  <div id="work" class="hide">
    <div class="bar">
      <span>笔刷</span><input type="range" id="brush" min="4" max="60" value="20">
      <button id="remove">去除</button>
      <button id="clear" class="ghost">清除</button>
      <button id="dl" disabled>下载</button>
    </div>
    <canvas id="view"></canvas>
    <canvas id="mask" class="hide"></canvas>
    <canvas id="orig" class="hide"></canvas>
    <div class="meta" id="meta">Brush the watermark area, then click Remove</div>
    <div class="note">OpenCV.js loads its code library from CDN once (images always stay on your device, never uploaded).</div>
  </div>
</div>
<script>
  const $=id=>document.getElementById(id);
  let cvReady=false,cvLoading=false;
  function loadCV(){return new Promise((res,rej)=>{
    if(cvReady){res();return;}
    if(cvLoading){const t=setInterval(()=>{if(cvReady){clearInterval(t);res();}},80);return;}
    cvLoading=true;
    const urls=[
      'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js',
      'https://unpkg.com/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js'
    ];
    const tryUrl=(i)=>{
      if(i>=urls.length){cvLoading=false;rej(new Error('引擎加载失败，请检查网络'));return;}
      const s=document.createElement('script');s.src=urls[i];
      s.onload=()=>{
        const d=(cvInstance)=>{ if(cvInstance) window.cv=cvInstance; cvReady=true; cvLoading=false; res(); };
        const cvMod=window.cv;
        if(cvMod instanceof Promise){
          cvMod.then(d).catch(()=>tryUrl(i+1));
        }else if(cvMod && cvMod.Mat && cvMod.getBuildInformation){
          d(cvMod);
        }else if(cvMod){
          cvMod.onRuntimeInitialized=()=>d(cvMod);
          setTimeout(()=>{ if(!cvReady) tryUrl(i+1); }, 15000);
        }else{
          tryUrl(i+1);
        }
      };
      s.onerror=()=>tryUrl(i+1);
      document.head.appendChild(s);
    };
    tryUrl(0);
  });}
  const drop=$('drop'),file=$('file'),work=$('work'),view=$('view'),mask=$('mask'),orig=$('orig'),meta=$('meta'),brush=$('brush'),remove=$('remove'),clear=$('clear'),dl=$('dl');
  let img=null,drawing=false,last=null,blob=null;
  function load(f){if(!f||!f.type.startsWith('image/'))return;const im=new Image();im.onload=()=>{
    img=im;const mw=330,sc=Math.min(1,mw/im.width);const w=Math.round(im.width*sc),h=Math.round(im.height*sc);
    [orig,view,mask].forEach(c=>{c.width=w;c.height=h;});
    orig.getContext('2d').drawImage(im,0,0,w,h);view.getContext('2d').drawImage(im,0,0,w,h);mask.getContext('2d').clearRect(0,0,w,h);
    work.classList.remove('hide');meta.textContent='涂抹水印区域后点「去除」';dl.disabled=true;blob=null;};im.src=URL.createObjectURL(f);}
  function pos(e){const r=view.getBoundingClientRect();const t=(e.touches&&e.touches[0])||e;return{x:(t.clientX-r.left)*(view.width/r.width),y:(t.clientY-r.top)*(view.height/r.height)};}
  function start(e){if(!img)return;drawing=true;last=pos(e);e.preventDefault();}
  function move(e){if(!drawing)return;const p=pos(e),bw=+brush.value;
    const mk=mask.getContext('2d');mk.strokeStyle='rgba(255,255,255,1)';mk.lineWidth=bw;mk.lineCap='round';mk.lineJoin='round';mk.beginPath();mk.moveTo(last.x,last.y);mk.lineTo(p.x,p.y);mk.stroke();
    const vw=view.getContext('2d');vw.strokeStyle='rgba(255,0,0,0.45)';vw.lineWidth=bw;vw.lineCap='round';vw.lineJoin='round';vw.beginPath();vw.moveTo(last.x,last.y);vw.lineTo(p.x,p.y);vw.stroke();last=p;e.preventDefault();}
  function end(){drawing=false;}
  view.addEventListener('mousedown',start);view.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
  view.addEventListener('touchstart',start,{passive:false});view.addEventListener('touchmove',move,{passive:false});view.addEventListener('touchend',end);
  drop.onclick=()=>file.click();file.onchange=e=>load(e.target.files[0]);
  ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag');}));
  drop.addEventListener('drop',e=>load(e.dataTransfer.files[0]));
  clear.onclick=()=>{if(!img)return;mask.getContext('2d').clearRect(0,0,mask.width,mask.height);view.getContext('2d').drawImage(img,0,0,mask.width,mask.height);meta.textContent='Cleared — you can re-brush';dl.disabled=true;blob=null;};
  remove.onclick=async()=>{if(!img)return;meta.textContent='Loading engine...';try{await loadCV();}catch(e){meta.textContent='Engine failed to load: '+e.message;return;}meta.textContent='Removing (locally)...';try{
    const src=cv.imread(orig);const msrc=cv.imread(mask);const m=new cv.Mat();cv.cvtColor(msrc,m,cv.COLOR_BGRA2GRAY);cv.threshold(m,m,30,255,cv.THRESH_BINARY);const dst=new cv.Mat();cv.inpaint(src,m,3,cv.INPAINT_TELEA,dst);cv.imshow(view,dst);meta.textContent='✓ Done · image never left your device';view.toBlob(b=>{blob=b;dl.disabled=false;},'image/png');src.delete();msrc.delete();m.delete();dst.delete();}catch(e){meta.textContent='Error: '+e.message;}};
  dl.onclick=()=>{if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='privguard-cleaned.png';a.click();};
</script>
</body>
</html>
